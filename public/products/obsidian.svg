  <rect x="158" y="243" width="184" height="104" rx="6" fill="#0a0a0a" opacity="0.98"/>
  <rect x="455" y="240" width="190" height="110" rx="8" fill="none" stroke="#c9a84c" stroke-width="2.5"/>
  <rect x="458" y="243" width="184" height="104" rx="6" fill="#0a0a0a" opacity="0.98"/>
  <!-- Bridge -->
  <line x1="345" y1="295" x2="455" y2="295" stroke="#c9a84c" stroke-width="2.5"/>

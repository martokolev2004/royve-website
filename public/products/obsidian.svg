<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="800" height="520">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e8e4de"/>
      <stop offset="100%" stop-color="#d8d4ce"/>
    </linearGradient>
    <radialGradient id="lensL" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#282828"/>
      <stop offset="100%" stop-color="#060606"/>
    </radialGradient>
    <radialGradient id="lensR" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#282828"/>
      <stop offset="100%" stop-color="#060606"/>
    </radialGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.2"/></filter>
  </defs>
  <rect width="800" height="520" fill="url(#bg)"/>

  <g filter="url(#shadow)">
    <!-- Left lens: same shape as AZURE but dark -->
    <rect x="95" y="155" width="248" height="185" rx="18" fill="url(#lensL)"/>
    <rect x="95" y="155" width="248" height="185" rx="18" fill="none" stroke="white" stroke-width="0.5" opacity="0.1"/>
    <!-- Subtle glint -->
    <ellipse cx="200" cy="176" rx="50" ry="10" fill="white" opacity="0.07" transform="rotate(-10,200,176)"/>

    <!-- Right lens -->
    <rect x="457" y="155" width="248" height="185" rx="18" fill="url(#lensR)"/>
    <rect x="457" y="155" width="248" height="185" rx="18" fill="none" stroke="white" stroke-width="0.5" opacity="0.1"/>
    <ellipse cx="562" cy="176" rx="50" ry="10" fill="white" opacity="0.07" transform="rotate(-10,562,176)"/>

    <!-- ROYVÉ on lens -->
    <text x="630" y="190" font-family="Georgia,serif" font-size="12" letter-spacing="2" fill="#c9a84c" text-anchor="middle" opacity="0.8">ROYVÉ</text>

    <!-- Bridge hardware -->
    <rect x="343" y="220" width="114" height="16" rx="8" fill="#c9a84c"/>
    <rect x="343" y="218" width="114" height="5" rx="2.5" fill="#e8c96a" opacity="0.6"/>
    <circle cx="400" cy="228" r="5" fill="#b89040"/>
    <circle cx="400" cy="228" r="2.5" fill="#e8c96a"/>

    <!-- Left hardware connectors -->
    <rect x="88" y="162" width="18" height="14" rx="3" fill="#c9a84c"/>
    <rect x="90" y="164" width="14" height="4" rx="1" fill="#e8c96a" opacity="0.7"/>
    <rect x="88" y="318" width="18" height="14" rx="3" fill="#c9a84c"/>
    <rect x="90" y="320" width="14" height="4" rx="1" fill="#e8c96a" opacity="0.7"/>
    <rect x="336" y="218" width="14" height="20" rx="4" fill="#c9a84c"/>
    <circle cx="343" cy="228" r="4" fill="#b89040"/>

    <!-- Right hardware -->
    <rect x="694" y="162" width="18" height="14" rx="3" fill="#c9a84c"/>
    <rect x="696" y="164" width="14" height="4" rx="1" fill="#e8c96a" opacity="0.7"/>
    <rect x="694" y="318" width="18" height="14" rx="3" fill="#c9a84c"/>
    <rect x="696" y="320" width="14" height="4" rx="1" fill="#e8c96a" opacity="0.7"/>
    <rect x="450" y="218" width="14" height="20" rx="4" fill="#c9a84c"/>
    <circle cx="457" cy="228" r="4" fill="#b89040"/>

    <!-- Temples -->
    <rect x="38" y="226" width="55" height="10" rx="5" fill="#1a1a1a"/>
    <rect x="18" y="230" width="24" height="4" rx="2" fill="#1a1a1a"/>
    <rect x="707" y="226" width="55" height="10" rx="5" fill="#1a1a1a"/>
    <rect x="758" y="230" width="24" height="4" rx="2" fill="#1a1a1a"/>
  </g>

  <text x="400" y="410" font-family="Georgia,serif" font-size="24" font-weight="700" letter-spacing="8" fill="#3a3a3a" text-anchor="middle" opacity="0.6">OBSIDIAN</text>
  <line x1="300" y1="426" x2="500" y2="426" stroke="#3a3a3a" stroke-width="0.5" opacity="0.25"/>
  <text x="400" y="448" font-family="Georgia,serif" font-size="11" letter-spacing="5" fill="#888" text-anchor="middle">ROYVÉ EYEWEAR</text>
</svg>

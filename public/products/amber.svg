<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="800" height="520">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e8e4de"/>
      <stop offset="100%" stop-color="#d8d4ce"/>
    </linearGradient>
    <radialGradient id="lensL" cx="30%" cy="25%" r="70%">
      <stop offset="0%" stop-color="#d4802a"/>
      <stop offset="50%" stop-color="#a85c18"/>
      <stop offset="100%" stop-color="#7a3e08"/>
    </radialGradient>
    <radialGradient id="lensR" cx="30%" cy="25%" r="70%">
      <stop offset="0%" stop-color="#d4802a"/>
      <stop offset="50%" stop-color="#a85c18"/>
      <stop offset="100%" stop-color="#7a3e08"/>
    </radialGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#3a2010" flood-opacity="0.2"/></filter>
  </defs>
  <rect width="800" height="520" fill="url(#bg)"/>

  <g filter="url(#shadow)">
    <!-- Left lens inner (amber) -->
    <rect x="118" y="168" width="218" height="168" rx="10" fill="url(#lensL)"/>
    <!-- Left outer thick frame -->
    <rect x="100" y="152" width="254" height="200" rx="16" fill="none" stroke="#0a0a0a" stroke-width="20"/>
    <!-- Left frame solid shape -->
    <rect x="100" y="152" width="254" height="200" rx="16" fill="#0a0a0a"/>
    <rect x="118" y="168" width="218" height="168" rx="8" fill="url(#lensL)"/>
    <!-- Amber glint -->
    <ellipse cx="190" cy="194" rx="45" ry="12" fill="#e89840" opacity="0.25" transform="rotate(-12,190,194)"/>

    <!-- Right frame -->
    <rect x="446" y="152" width="254" height="200" rx="16" fill="#0a0a0a"/>
    <rect x="464" y="168" width="218" height="168" rx="8" fill="url(#lensR)"/>
    <ellipse cx="536" cy="194" rx="45" ry="12" fill="#e89840" opacity="0.25" transform="rotate(-12,536,194)"/>

    <!-- ROYVÉ on frame temple area -->
    <text x="620" y="200" font-family="Georgia,serif" font-size="12" letter-spacing="2" fill="#c9a84c" text-anchor="middle" opacity="0.7">ROYVÉ</text>

    <!-- Bridge: thick frame connecting piece -->
    <rect x="354" y="185" width="92" height="34" rx="10" fill="#0a0a0a"/>

    <!-- Nose bridge inner detail -->
    <rect x="366" y="194" width="22" height="18" rx="5" fill="#1a1a1a"/>
    <rect x="412" y="194" width="22" height="18" rx="5" fill="#1a1a1a"/>

    <!-- Left temple: thick to match frame -->
    <rect x="35" y="230" width="68" height="18" rx="9" fill="#0a0a0a"/>
    <rect x="16" y="236" width="22" height="6" rx="3" fill="#0a0a0a"/>
    <!-- Right temple -->
    <rect x="697" y="230" width="68" height="18" rx="9" fill="#0a0a0a"/>
    <rect x="762" y="236" width="22" height="6" rx="3" fill="#0a0a0a"/>

    <!-- Hinge left -->
    <rect x="98" y="220" width="10" height="36" rx="3" fill="#1a1a1a"/>
    <!-- Hinge right -->
    <rect x="692" y="220" width="10" height="36" rx="3" fill="#1a1a1a"/>

    <!-- Frame top edge highlight -->
    <rect x="102" y="154" width="250" height="6" rx="3" fill="#2a2a2a" opacity="0.5"/>
    <rect x="448" y="154" width="250" height="6" rx="3" fill="#2a2a2a" opacity="0.5"/>
  </g>

  <text x="400" y="415" font-family="Georgia,serif" font-size="26" font-weight="700" letter-spacing="12" fill="#3a3a3a" text-anchor="middle" opacity="0.6">AMBER</text>
  <line x1="320" y1="431" x2="480" y2="431" stroke="#3a3a3a" stroke-width="0.5" opacity="0.25"/>
  <text x="400" y="453" font-family="Georgia,serif" font-size="11" letter-spacing="5" fill="#888" text-anchor="middle">ROYVÉ EYEWEAR</text>
</svg>

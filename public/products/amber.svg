<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <radialGradient id="bg" cx="30%" cy="60%" r="80%">
      <stop offset="0%" stop-color="#c8a870"/>
      <stop offset="40%" stop-color="#b8955a"/>
      <stop offset="100%" stop-color="#8a6535"/>
    </radialGradient>
    <radialGradient id="lensL" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#c4602a"/>
      <stop offset="60%" stop-color="#8a3a10"/>
      <stop offset="100%" stop-color="#5a2008"/>
    </radialGradient>
    <radialGradient id="lensR" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#c4602a"/>
      <stop offset="60%" stop-color="#8a3a10"/>
      <stop offset="100%" stop-color="#5a2008"/>
    </radialGradient>
    <filter id="shadow">
      <feDropShadow dx="4" dy="12" stdDeviation="14" flood-color="#3a2010" flood-opacity="0.4"/>
    </filter>
  </defs>
  <!-- Background - warm outdoor/pool towel texture feel -->
  <rect width="800" height="500" fill="url(#bg)"/>
  <!-- Subtle texture lines -->
  <line x1="0" y1="30" x2="800" y2="30" stroke="#b89050" stroke-width="0.5" opacity="0.4"/>
  <line x1="0" y1="60" x2="800" y2="60" stroke="#b89050" stroke-width="0.5" opacity="0.3"/>
  <line x1="0" y1="90" x2="800" y2="90" stroke="#b89050" stroke-width="0.5" opacity="0.4"/>
  <line x1="0" y1="120" x2="800" y2="120" stroke="#b89050" stroke-width="0.5" opacity="0.3"/>
  <line x1="0" y1="150" x2="800" y2="150" stroke="#b89050" stroke-width="0.5" opacity="0.4"/>
  <line x1="0" y1="180" x2="800" y2="180" stroke="#b89050" stroke-width="0.5" opacity="0.3"/>
  <line x1="0" y1="210" x2="800" y2="210" stroke="#b89050" stroke-width="0.5" opacity="0.4"/>
  <line x1="0" y1="240" x2="800" y2="240" stroke="#b89050" stroke-width="0.5" opacity="0.3"/>
  <line x1="0" y1="270" x2="800" y2="270" stroke="#b89050" stroke-width="0.5" opacity="0.4"/>
  <line x1="0" y1="300" x2="800" y2="300" stroke="#b89050" stroke-width="0.5" opacity="0.3"/>
  <line x1="0" y1="330" x2="800" y2="330" stroke="#b89050" stroke-width="0.5" opacity="0.4"/>
  <line x1="0" y1="360" x2="800" y2="360" stroke="#b89050" stroke-width="0.5" opacity="0.3"/>
  <line x1="0" y1="390" x2="800" y2="390" stroke="#b89050" stroke-width="0.5" opacity="0.4"/>
  <line x1="0" y1="420" x2="800" y2="420" stroke="#b89050" stroke-width="0.5" opacity="0.3"/>
  <line x1="0" y1="450" x2="800" y2="450" stroke="#b89050" stroke-width="0.5" opacity="0.4"/>
  <line x1="0" y1="480" x2="800" y2="480" stroke="#b89050" stroke-width="0.5" opacity="0.3"/>

  <!-- Glasses -->
  <g filter="url(#shadow)">
    <!-- Left lens frame -->
    <rect x="110" y="165" width="230" height="158" rx="14" fill="#0a0a0a"/>
    <rect x="122" y="177" width="206" height="134" rx="8" fill="url(#lensL)"/>
    <rect x="122" y="177" width="206" height="9" rx="4" fill="#d06830" opacity="0.4"/>

    <!-- Right lens frame -->
    <rect x="460" y="165" width="230" height="158" rx="14" fill="#0a0a0a"/>
    <rect x="472" y="177" width="206" height="134" rx="8" fill="url(#lensR)"/>
    <rect x="472" y="177" width="206" height="9" rx="4" fill="#d06830" opacity="0.4"/>

    <!-- Bridge -->
    <rect x="340" y="185" width="120" height="22" rx="11" fill="#0a0a0a"/>

    <!-- Temples -->
    <rect x="55" y="183" width="57" height="18" rx="9" fill="#0a0a0a"/>
    <rect x="40" y="188" width="18" height="8" rx="4" fill="#0a0a0a"/>
    <rect x="688" y="183" width="57" height="18" rx="9" fill="#0a0a0a"/>
    <rect x="742" y="188" width="18" height="8" rx="4" fill="#0a0a0a"/>

    <!-- Hinges -->
    <rect x="108" y="177" width="8" height="32" rx="2" fill="#1a1a1a"/>
    <rect x="684" y="177" width="8" height="32" rx="2" fill="#1a1a1a"/>

    <!-- ROYVÉ branding on frame -->
    <text x="620" y="252" font-family="Georgia, serif" font-size="11" letter-spacing="2" fill="#c8803a" text-anchor="middle" opacity="0.8">ROYVÉ</text>

    <!-- Warm light reflections on amber lenses -->
    <ellipse cx="175" cy="205" rx="32" ry="10" fill="#ff9050" opacity="0.12" transform="rotate(-15, 175, 205)"/>
    <ellipse cx="525" cy="205" rx="32" ry="10" fill="#ff9050" opacity="0.12" transform="rotate(-15, 525, 205)"/>
  </g>

  <!-- Brand label -->
  <text x="400" y="395" font-family="Georgia, serif" font-size="28" font-weight="700" letter-spacing="10" fill="#3a2010" text-anchor="middle" opacity="0.6">AMBER</text>
  <line x1="320" y1="410" x2="480" y2="410" stroke="#3a2010" stroke-width="0.5" opacity="0.3"/>
  <text x="400" y="432" font-family="Georgia, serif" font-size="11" letter-spacing="5" fill="#5a3820" text-anchor="middle" opacity="0.5">ROYVÉ EYEWEAR</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#f5f5f5"/>
      <stop offset="100%" stop-color="#e8e8e8"/>
    </radialGradient>
    <radialGradient id="lensL" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#2a2a2a"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </radialGradient>
    <radialGradient id="lensR" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#2a2a2a"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="800" height="500" fill="url(#bg)"/>

  <!-- Full glasses group with shadow -->
  <g filter="url(#shadow)">
    <!-- Left lens - thick chunky rectangular frame -->
    <rect x="110" y="170" width="230" height="155" rx="14" fill="#0a0a0a"/>
    <rect x="122" y="182" width="206" height="131" rx="8" fill="url(#lensL)"/>
    <!-- Frame highlight -->
    <rect x="122" y="182" width="206" height="8" rx="4" fill="#2a2a2a" opacity="0.6"/>

    <!-- Right lens -->
    <rect x="460" y="170" width="230" height="155" rx="14" fill="#0a0a0a"/>
    <rect x="472" y="182" width="206" height="131" rx="8" fill="url(#lensR)"/>
    <rect x="472" y="182" width="206" height="8" rx="4" fill="#2a2a2a" opacity="0.6"/>

    <!-- Bridge - thick -->
    <rect x="340" y="190" width="120" height="22" rx="11" fill="#0a0a0a"/>

    <!-- Nose pads area -->
    <rect x="352" y="212" width="14" height="20" rx="4" fill="#111"/>
    <rect x="434" y="212" width="14" height="20" rx="4" fill="#111"/>

    <!-- Left temple -->
    <rect x="60" y="188" width="52" height="18" rx="9" fill="#0a0a0a"/>
    <rect x="44" y="193" width="20" height="8" rx="4" fill="#0a0a0a"/>

    <!-- Right temple -->
    <rect x="688" y="188" width="52" height="18" rx="9" fill="#0a0a0a"/>
    <rect x="736" y="193" width="20" height="8" rx="4" fill="#0a0a0a"/>

    <!-- Hinge left -->
    <rect x="108" y="182" width="8" height="32" rx="2" fill="#1a1a1a"/>
    <!-- Hinge right -->
    <rect x="684" y="182" width="8" height="32" rx="2" fill="#1a1a1a"/>

    <!-- ROYVÉ logo on right lens -->
    <text x="620" y="256" font-family="Georgia, serif" font-size="11" letter-spacing="2" fill="#3a3a3a" text-anchor="middle" opacity="0.7">ROYVÉ</text>

    <!-- Lens reflection glint left -->
    <ellipse cx="175" cy="210" rx="28" ry="8" fill="white" opacity="0.06" transform="rotate(-20, 175, 210)"/>
    <!-- Lens reflection glint right -->
    <ellipse cx="525" cy="210" rx="28" ry="8" fill="white" opacity="0.06" transform="rotate(-20, 525, 210)"/>
  </g>

  <!-- Product name below -->
  <text x="400" y="400" font-family="Georgia, serif" font-size="28" font-weight="700" letter-spacing="14" fill="#1a1a1a" text-anchor="middle" opacity="0.7">NOIR</text>
  <line x1="340" y1="416" x2="460" y2="416" stroke="#1a1a1a" stroke-width="0.5" opacity="0.3"/>
  <text x="400" y="438" font-family="Georgia, serif" font-size="11" letter-spacing="5" fill="#888" text-anchor="middle">ROYVÉ EYEWEAR</text>
</svg>
